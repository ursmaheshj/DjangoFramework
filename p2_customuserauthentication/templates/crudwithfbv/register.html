{% extends 'crudwithfbv/base.html' %}

 {% block content %}

<div class="row mb-3">
    <form target="" method="post" novalidate>
        {% csrf_token %}
        {% for field in form %}
            <div class="row mb-3">
                <label for="inputEmail3" class="col-sm-2 col-form-label">{{field.label}}</label>
                    <div class="col-sm-10">
                        {{field}}
                    </div>
                    {% if field.errors %}
                        {% for error in field.errors %}
                            {{error}}
                        {% endfor %}
                    {% endif %}
            </div>
        {% endfor %}
        {{ form.non_field_errors }}
  <button type="submit" class="btn btn-primary">Log in</button>
</form>

</div>

{% endblock content %}
