{% extends "genericcbv/base.html" %}

{% block content %}

<div class="container">
        
       <div class="row">
            <div class="col-12">
                <h3 class="mb-3">Records List</h3>
                <div class="card shadow-sm">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover mb-0 align-middle">
                            <thead class="table-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Age</th>
                                    <th class="text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for user in user_list %}
                                <tr>
                                    <td>{{user.id}}</td>
                                    <td>{{user.name}}</td>
                                    <td>{{user.email}}</td>
                                    <td>{{user.age}}</td>
                                    <td class="text-end">
                                        <a href="{% url "detailuser" user.id %}"><button class="btn btn-sm btn-info text-white">View</button></a>
                                        <a href="{% url "updateuser" user.id %}"><button class="btn btn-sm btn-warning">Edit</button></a>
                                        <a href="{% url "deleteuser" user.id %}"><button class="btn btn-sm btn-danger">Delete</button></a>
                                    </td>
                                </tr>
                                {% endfor %}
                                
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </div>

<div>

{% endblock content %}
